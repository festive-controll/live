  <!-- Realtime Data Retrieval & Grouping Script -->
  <script>
    let rawPrograms = [];
    let venuesMap = {};
    let currentQuickFilter = 'all';

    // Helper to resolve venue name from program object & venues collection map
    function getProgramVenue(p) {
      if (!p) return 'TBA';
      if (p.venueName) return p.venueName;
      if (p.venue) return p.venue;
      if (p.venueId && venuesMap[p.venueId]) return venuesMap[p.venueId];
      if (p.place) return p.place;
      if (p.subStage) return p.subStage;
      if (p.venueType) return p.venueType;
      return 'TBA';
    }

    // Public schedule is reserved for stage programs. Support both the current
    // venue-type fields and legacy Y-series program codes.
    function isStageProgram(program) {
      if (!program || program.isNonStage === true || program.isStage === false) return false;
      if (program.isStage === true) return true;

      const type = [program.venueTypeName, program.venueType, program.venue_type, program.progSet]
        .filter(value => typeof value === 'string')
        .join(' ')
        .trim()
        .toLowerCase()
        .replace(/[\s_-]+/g, '');

      if (type.includes('nonstage') || type.includes('sport')) return false;
      if (type.includes('stage')) return true;

      const code = String(program.code || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
      return /^[A-Z]*Y\d+/.test(code);
    }

    function setDateQuickFilter(filter) {
      currentQuickFilter = filter;
      ['all', 'today', 'tomorrow'].forEach(f => {
        const btn = document.getElementById('btn-filter-' + f);
        if (btn) {
          if (f === filter) {
            btn.className = 'px-5 py-1.5 rounded-full text-xs font-bold transition-all bg-[#92205D] text-white shadow-xs';
          } else {
            btn.className = 'px-5 py-1.5 rounded-full text-xs font-bold transition-all bg-white text-gray-600 border border-gray-200/80 hover:bg-gray-100';
          }
        }
      });
      filterSchedules();
    }

    // Dynamic brand color palette for Section badges
    function getSectionBadgeColor(sectionName) {
      if (!sectionName) return 'bg-[#37314F] text-white';
      const sec = sectionName.toUpperCase();
      if (sec.includes('BIDÄ€YA') || sec.includes('BIDAYA')) return 'bg-[#92205D] text-white';
      if (sec.includes('ÅªLÄ€') || sec.includes('ULA')) return 'bg-[#17635F] text-white';
      if (sec.includes('THÄ€NIYA') || sec.includes('THANIYA')) return 'bg-[#37314F] text-white';
      if (sec.includes('THÄ€NAWIYYA') || sec.includes('THANAWIYYA')) return 'bg-[#C0912B] text-white';
      if (sec.includes('Ä€LIYA') || sec.includes('ALIYA')) return 'bg-[#92205D] text-white';
      if (sec.includes('KULLIYYA') || sec.includes('KULLIYYAH')) return 'bg-[#17635F] text-white';
      return 'bg-[#C0912B] text-white';
    }

    // Format ISO dateTime-local string to "Aug 31, 2026"
    function formatDateNice(timeString) {
      if (!timeString) return 'TBA';
      try {
        const datePart = timeString.split('T')[0];
        const parts = datePart.split('-');
        if (parts.length === 3) {
          const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
          const year = parts[0];
          const month = months[parseInt(parts[1], 10) - 1] || parts[1];
          const day = parseInt(parts[2], 10);
          return `${month} ${day}, ${year}`;
        }
      } catch (e) { }
      return 'TBA';
    }

    // Format ISO dateTime-local string to AM/PM format
    function formatTime(timeString) {
      if (!timeString) return 'TBA';
      const parts = timeString.split('T');
      if (parts.length < 2) return 'TBA';
      const [hourStr, minStr] = parts[1].split(':');
      let hour = parseInt(hourStr, 10);
      const min = minStr;
      const ampm = hour >= 12 ? 'PM' : 'AM';
      hour = hour % 12;
      hour = hour ? hour : 12; // 0 should be 12
      return `${hour}:${min} ${ampm}`;
    }

    // Date comparison helper for Today / Tomorrow
    function isSameDate(timeString, targetDate) {
      if (!timeString) return false;
      const pDate = timeString.split('T')[0];
      const yyyy = targetDate.getFullYear();
      const mm = String(targetDate.getMonth() + 1).padStart(2, '0');
      const dd = String(targetDate.getDate()).padStart(2, '0');
      return pDate === `${yyyy}-${mm}-${dd}`;
    }

    // Listen to Firebase updates
    if (window.db) {
      // Listen to venues collection to map venueId -> venue name
      window.db.collection('venues').onSnapshot(snap => {
        venuesMap = {};
        snap.docs.forEach(doc => {
          const d = doc.data();
          venuesMap[doc.id] = d.name || d.place || 'Venue';
        });
        if (rawPrograms.length > 0) {
          populateFilterDropdowns();
          renderSchedules();
        }
      }, err => console.error("Venues read error:", err));

      window.db.collection('programs').where('status', '==', true).onSnapshot(snap => {
        rawPrograms = snap.docs
          .map(doc => ({ id: doc.id, ...doc.data() }))
          .filter(isStageProgram);

        // Sort chronologically by date-time. Empty dates go to the bottom.
        rawPrograms.sort((a, b) => {
          const timeA = a.time || '9999-12-31T23:59';
          const timeB = b.time || '9999-12-31T23:59';
          return timeA.localeCompare(timeB);
        });

        // Initialize unique section, date, and venue dropdowns
        populateFilterDropdowns();

        // Render UI
        renderSchedules();
      }, err => {
        console.error("Firebase read error: ", err);
        document.getElementById('schedule-container').innerHTML = `
          <div class="flex justify-center items-center py-20 flex-col gap-2">
            <span class="iconify text-4xl text-[#92205D]" data-icon="ph:exclamation-mark-bold"></span>
            <p class="text-neutral-600 font-medium">Failed to sync schedule data.</p>
          </div>`;
      });
    }

    // Populate Filter Dropdowns dynamically
    function populateFilterDropdowns() {
      const selectSection = document.getElementById('filter-section');
      const selectDate = document.getElementById('filter-date');
      const selectVenue = document.getElementById('filter-venue');

      const savedSec = selectSection.value;
      const savedDate = selectDate.value;
      const savedVenue = selectVenue.value;

      const uniqueSections = [...new Set(rawPrograms.map(p => p.section).filter(Boolean))].sort();
      const uniqueDates = [...new Set(rawPrograms.map(p => formatDateNice(p.time)).filter(d => d && d !== 'TBA'))].sort();
      const uniqueVenues = [...new Set(rawPrograms.map(p => getProgramVenue(p)).filter(v => v && v !== 'TBA'))].sort();

      // Category / Section
      let secHtml = '<option value="">Category</option>';
      uniqueSections.forEach(sec => {
        secHtml += `<option value="${sec}">${sec}</option>`;
      });
      selectSection.innerHTML = secHtml;
      selectSection.value = savedSec;

      // Date
      let dateHtml = '<option value="">Date</option>';
      uniqueDates.forEach(d => {
        dateHtml += `<option value="${d}">${d}</option>`;
      });
      selectDate.innerHTML = dateHtml;
      selectDate.value = savedDate;

      // Venue
      let venueHtml = '<option value="">Venue</option>';
      uniqueVenues.forEach(v => {
        venueHtml += `<option value="${v}">${v}</option>`;
      });
      selectVenue.innerHTML = venueHtml;
      selectVenue.value = savedVenue;
    }

    // Filter and Render
    function filterSchedules() {
      renderSchedules();
    }

    function renderSchedules() {
      const searchVal = document.getElementById('search-programs').value.toLowerCase().trim();
      const sectionVal = document.getElementById('filter-section').value;
      const dateVal = document.getElementById('filter-date').value;
      const venueVal = document.getElementById('filter-venue').value;
      const container = document.getElementById('schedule-container');

      const today = new Date();
      const tomorrow = new Date();
      tomorrow.setDate(today.getDate() + 1);

      const filtered = rawPrograms.filter(p => {
        if (sectionVal && p.section !== sectionVal) return false;
        if (searchVal && !p.name.toLowerCase().includes(searchVal)) return false;
        if (venueVal && getProgramVenue(p) !== venueVal) return false;
        if (dateVal && formatDateNice(p.time) !== dateVal) return false;

        if (currentQuickFilter === 'today' && !isSameDate(p.time, today)) return false;
        if (currentQuickFilter === 'tomorrow' && !isSameDate(p.time, tomorrow)) return false;

        return true;
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="flex flex-col items-center justify-center py-28 text-center">
            <span class="iconify text-6xl text-neutral-300 mb-4" data-icon="ph:calendar-blank-duotone"></span>
            <h3 class="font-sans font-medium text-xl text-neutral-900 tracking-tight">No events found</h3>
            <p class="text-neutral-500 text-sm max-w-sm mt-1 leading-relaxed">We couldn't find any events matching your filter criteria.</p>
          </div>`;
        return;
      }

      let html = '<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">';

      filtered.forEach(p => {
        const startTimeStr = formatTime(p.time);
        const endTimeStr = formatTime(p.endTime);
        const timeStr = p.endTime ? `${startTimeStr} - ${endTimeStr}` : startTimeStr;
        const dateStr = formatDateNice(p.time);
        const sectionTag = p.section || p.category || 'GENERAL';
        const badgeClass = getSectionBadgeColor(sectionTag);
        const descText = p.conceptNote || p.description || 'No description available';
        const venueText = getProgramVenue(p);
        const durationText = p.duration || '30 min';

        html += `
          <div class="bg-white border border-gray-100 rounded-2xl p-5 shadow-[0_4px_20px_-4px_rgba(0,0,0,0.03)] hover:shadow-md hover:border-[#17635F]/30 transition-all duration-300 flex flex-col justify-between group">
            <div>
              <!-- Header: Program Name & Category Tag -->
              <div class="flex justify-between items-start mb-2 gap-3">
                <h3 class="font-sans font-semibold text-base md:text-lg text-gray-900 uppercase tracking-tight leading-snug group-hover:text-[#17635F] transition-colors">${p.name || 'UNNAMED PROGRAM'}</h3>
                <span class="text-[10px] font-semibold ${badgeClass} px-2.5 py-1 rounded-lg uppercase tracking-wider shrink-0 shadow-2xs">${sectionTag}</span>
              </div>

              <!-- Subtitle / Concept note -->
              <p class="text-xs text-gray-400 font-normal mb-5 line-clamp-2">${descText}</p>
            </div>

            <!-- Meta Info Cards Grid -->
            <div class="space-y-2 mt-auto">
              <!-- Date & Time Row -->
              <div class="grid grid-cols-2 gap-2">
                <!-- Date Pill -->
                <div class="flex items-center gap-2 bg-gray-50 border border-gray-100/80 px-3 py-2 rounded-xl text-xs font-medium text-gray-700">
                  <i class="fi fi-rr-calendar text-[#92205D] text-sm"></i>
                  <span class="truncate">${dateStr}</span>
                </div>
                <!-- Time Pill -->
                <div class="flex items-center gap-2 bg-gray-50 border border-gray-100/80 px-3 py-2 rounded-xl text-xs font-medium text-gray-700">
                  <i class="fi fi-rr-clock text-[#17635F] text-sm"></i>
                  <span class="truncate">${timeStr}</span>
                </div>
              </div>

              <!-- Venue & Duration Row -->
              <div class="flex items-center justify-between bg-gray-50 border border-gray-100/80 px-3 py-2 rounded-xl text-xs font-medium text-gray-700">
                <div class="flex items-center gap-2 truncate">
                  <i class="fi fi-rr-marker text-[#C0912B] text-sm shrink-0"></i>
                  <span class="truncate">${venueText}</span>
                </div>
                <span class="text-[11px] font-medium text-gray-400 shrink-0 ml-2">${durationText}</span>
              </div>
            </div>
          </div>`;
      });

      html += '</div>';
      container.innerHTML = html;
    }
  </script>
</body>

</html>
