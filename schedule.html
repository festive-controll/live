  <!-- Realtime Data Retrieval & Grouping Script -->
  <script>
    let rawPrograms = [];

    // Format ISO dateTime-local string to "D-M-YYYY" zone-independent format
    function formatDate(timeString) {
      if (!timeString) return 'Not Scheduled';
      const datePart = timeString.split('T')[0];
      const parts = datePart.split('-');
      if (parts.length !== 3) return 'Not Scheduled';
      const year = parts[0];
      const month = parseInt(parts[1], 10);
      const day = parseInt(parts[2], 10);
      return `${day}-${month}-${year}`; // e.g. 22-7-2026 or 1-1-2026
    }

    // Format ISO dateTime-local string to AM/PM format
    function formatTime(timeString) {
      if (!timeString) return '—';
      const parts = timeString.split('T');
      if (parts.length < 2) return '—';
      const [hourStr, minStr] = parts[1].split(':');
      let hour = parseInt(hourStr, 10);
      const min = minStr;
      const ampm = hour >= 12 ? 'PM' : 'AM';
      hour = hour % 12;
      hour = hour ? hour : 12; // 0 should be 12
      return `${hour}:${min} ${ampm}`;
    }

    // Listen to Firebase updates
    if (window.db) {
      window.db.collection('programs').where('status', '==', true).onSnapshot(snap => {
        rawPrograms = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));

        // Sort chronologically by date-time. Empty dates go to the bottom.
        rawPrograms.sort((a, b) => {
          const timeA = a.time || '9999-12-31T23:59';
          const timeB = b.time || '9999-12-31T23:59';
          return timeA.localeCompare(timeB);
        });

        // Initialize unique section and skill dropdowns
        populateFilterDropdowns();

        // Render UI
        renderSchedules();
      }, err => {
        console.error("Firebase read error: ", err);
        document.getElementById('schedule-container').innerHTML = `
          <div class="flex justify-center items-center py-20 flex-col gap-2">
            <span class="iconify text-4xl text-brandRed" data-icon="ph:exclamation-mark-bold"></span>
            <p class="text-neutral-600 font-medium">Failed to sync schedule data.</p>
          </div>`;
      });
    }

    // Populate Filter Dropdowns dynamically
    function populateFilterDropdowns() {
      const selectSection = document.getElementById('filter-section');
      const savedSec = selectSection.value;

      // Extract unique values
      const uniqueSections = [...new Set(rawPrograms.map(p => p.section).filter(Boolean))].sort();

      // Populate Section select
      let sectionHtml = '<option value="">All Sections</option>';
      uniqueSections.forEach(sec => {
        sectionHtml += `<option value="${sec}">${sec}</option>`;
      });
      selectSection.innerHTML = sectionHtml;
      selectSection.value = savedSec;
    }

    // Filter and Render grouped list
    function filterSchedules() {
      renderSchedules();
    }

    function renderSchedules() {
      const searchVal = document.getElementById('search-programs').value.toLowerCase().trim();
      const sectionVal = document.getElementById('filter-section').value;
      const container = document.getElementById('schedule-container');

      // Group filtered programs
      const grouped = new Map(); // Date string -> Program objects

      let matchCount = 0;

      rawPrograms.forEach(p => {
        // Apply filters
        if (sectionVal && p.section !== sectionVal) return;
        if (searchVal && !p.name.toLowerCase().includes(searchVal)) return;

        matchCount++;

        // Determine date grouping key
        const dateKey = formatDate(p.time);

        if (!grouped.has(dateKey)) {
          grouped.set(dateKey, []);
        }
        grouped.get(dateKey).push(p);
      });

      if (matchCount === 0) {
        container.innerHTML = `
          <div class="flex flex-col items-center justify-center py-32 text-center">
            <span class="iconify text-6xl text-neutral-300 mb-4" data-icon="ph:calendar-blank-duotone"></span>
            <h3 class="font-sans font-medium text-xl text-neutral-900 tracking-tight">No schedules found</h3>
            <p class="text-neutral-500 text-sm max-w-sm mt-1 leading-relaxed">We couldn't find any programs matching your filter criteria.</p>
          </div>`;
        return;
      }

      // Generate HTML
      let html = '';

      // Iterating through Map preserves chronological order from rawPrograms.sort()
      grouped.forEach((programs, dateKey) => {
        const isNotScheduled = dateKey === 'Not Scheduled';

        // Date Header Section
        html += `
          <div class="mb-10">
            <div class="flex items-center gap-4 mb-6">
              <div class="${isNotScheduled ? 'bg-neutral-500 text-white' : 'bg-brandBlue text-white'} px-5 py-2.5 rounded-[18px] font-bold text-xs uppercase tracking-wider shadow-sm flex items-center gap-2">
                <i class="fi ${isNotScheduled ? 'fi-rr-circle-dashed' : 'fi-rr-calendar-clock'} text-sm mt-0.5"></i>
                <span>${dateKey}</span>
              </div>
              <div class="h-[1px] bg-neutral-100 flex-grow"></div>
            </div>

            <!-- Program Cards Grid -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">`;

        programs.forEach(p => {
          const timeStr = formatTime(p.time);

          html += `
              <div class="bg-white border border-neutral-100 rounded-[20px] p-4 shadow-[0_2px_12px_-4px_rgba(0,0,0,0.02)] hover:shadow-md hover:border-neutral-200/50 transition-all duration-300 flex flex-col justify-between hover:-translate-y-0.5 group">
                <div>
                  <!-- Card Header: Code & Time -->
                  <div class="flex justify-between items-center mb-4 gap-2">
                    <span class="text-[11px] font-mono font-bold bg-neutral-50 text-neutral-500 border border-neutral-200/60 px-3 py-1 rounded-xl shrink-0 uppercase tracking-wide">${p.code || 'PRG'}</span>
                    ${!isNotScheduled ? `
                      <span class="text-[11px] font-bold text-brandBlue bg-blue-50/50 border border-brandBlue/10 px-3 py-1 rounded-xl flex items-center gap-1.5 shrink-0">
                        <i class="fi fi-rr-clock text-[10px] mt-0.5"></i> ${timeStr}
                      </span>
                    ` : ''}
                  </div>

                  <!-- Program Name -->
                  <h3 class="font-sans font-medium text-lg text-neutral-900 group-hover:text-brandBlue transition-colors mb-3 leading-tight tracking-tight">${p.name || 'Unnamed Program'}</h3>

                  <!-- Metadata Tags -->
                  <div class="flex flex-wrap gap-2 mb-4">
                    <span class="text-[10px] font-bold bg-[#E8F2FA] text-[#2075BC] border border-[#2075BC]/10 px-2.5 py-0.5 rounded-full uppercase tracking-wider">${p.section || '—'}</span>
                  </div>
                </div>

                <!-- Concept Note Text Area Container -->
                <div class="mt-2">
                  ${p.conceptNote ? `
                    <div class="bg-neutral-50 rounded-[16px] p-3 border border-neutral-100/50">
                      <div class="text-[9px] uppercase font-bold text-neutral-400 mb-1 tracking-widest">Concept Note</div>
                      <p class="font-sans text-xs text-neutral-500 leading-relaxed whitespace-pre-line">${p.conceptNote}</p>
                    </div>
                  ` : `
                    <p class="text-xs text-neutral-400 italic font-light">No concept note available</p>
                  `}
                </div>
              </div>`;
        });

        html += `
            </div>
          </div>`;
      });

      container.innerHTML = html;
    }
  </script>
